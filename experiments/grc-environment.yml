# GraphRicciCurvature 0.6.1 (the E5 baseline) caps scipy <= 1.13.1, so it has its own environment,
# found by main.py when created next to the orcut one (or set ORCUT_GRC_PYTHON to its python):
#   conda env create -f experiments/grc-environment.yml && conda activate orcut-grc
#   pip install --no-deps GraphRicciCurvature==0.6.1
name: orcut-grc
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.0.2
  - scipy=1.13.1
  - networkx=3.3
  - networkit=11.2
  - python-louvain=0.16
  - cython
  - packaging
  - pot=0.9.7
  - pip
