# The versions of the experiments of the paper (GraphRicciCurvature: experiments/grc-environment.yml).
#   conda env create -f environment.yml && conda activate orcut
#   pip install --no-index --no-deps --no-build-isolation -e .
name: orcut
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.2.5
  - scipy=1.16.3
  - numba=0.62.1
  - setuptools>=68
  - pip
  # tests
  - pytest
  - hypothesis
  - networkx=3.3
  # experiments
  - pandas
  - matplotlib
  - pot=0.9.7
  - ortools-python=9.15
